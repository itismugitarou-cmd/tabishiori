<header class="top">
  <div class="wrap">
    <!--LOGO_OPEN--><div class="logo">たび<b>しおり</b></div><!--LOGO_CLOSE-->
    <div class="tagline">出発地と行き先、泊数を入れるだけ。定番と穴場をまぜた旅程表をつくります。</div><!--LANG-->
  </div>
</header>

<main class="wrap layout">
  <form id="tripForm" class="panel" autocomplete="off">
    <h2>旅の条件</h2>
    <div class="field">
      <label for="from">出発地</label>
      <input type="text" id="from" placeholder="市区町村名で検索(例:名古屋市、せたがや)">
      <div class="hint" id="fromPicked"></div>
    </div>
    <div class="field">
      <label for="to">行き先</label>
      <input type="text" id="to" placeholder="市区町村名で検索(例:高山市、おたる)">
      <div class="hint" id="toPicked"></div>
      <div class="hint" id="destHint"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="date">出発日</label>
        <input type="date" id="date">
      </div>
      <div class="field">
        <label for="nights">日数</label>
        <select id="nights"></select>
      </div>
    </div>
    <div class="field">
      <span class="legend">旅のペース</span>
      <div class="seg" role="radiogroup" aria-label="旅のペース">
        <label><input type="radio" name="pace" id="paceSlow" value="slow"><span>ゆっくり</span></label>
        <label><input type="radio" name="pace" id="paceNormal" value="normal" checked><span>ふつう</span></label>
        <label><input type="radio" name="pace" id="paceMany" value="many"><span>たくさん回る</span></label>
      </div>
    </div>
    <div class="field">
      <span class="legend">プランの味つけ</span>
      <div class="seg" role="radiogroup" aria-label="プランの味つけ">
        <label><input type="radio" name="style" id="styleF" value="0"><span>定番</span></label>
        <label><input type="radio" name="style" id="styleB" value="1" checked><span>いいとこどり</span></label>
        <label><input type="radio" name="style" id="styleH" value="2"><span>マニアック</span></label>
      </div>
      <div class="hint">3種類とも作るので、あとで見比べられます</div>
    </div>
    <div class="field">
      <span class="legend">興味のあること</span>
      <div class="chips" id="interests"></div>
    </div>
    <div class="row2">
      <div class="field">
        <label for="budget">予算感</label>
        <select id="budget">
          <option value="low">節約</option>
          <option value="mid" selected>ふつう</option>
          <option value="high">ちょっと贅沢</option>
        </select>
      </div>
      <div class="field">
        <label for="people">人数</label>
        <input type="number" id="people" min="1" max="20" value="2">
      </div>
    </div>
    <label class="toggle"><input type="checkbox" id="rain"> 雨の日モード(屋内スポット優先)</label>
    <button type="submit" class="go">プランをつくる</button>
  </form>

  <section class="result" id="result" aria-live="polite">
    <div class="loading">プランを準備しています…</div>
  </section>
</main>
<!--SEO-->

<footer class="foot">
  <div class="wrap">所要時間・料金・営業情報は目安です。お出かけ前に各施設の公式情報をご確認ください。天気予報は Open-Meteo、登録外の行き先は Wikipedia の情報を使っています。当サイトはアフィリエイト広告(PR)を利用しています。<!--FOOTLINKS--></div>
</footer>
